name: Update convertible bonds project

on:
  schedule:
    - cron: '43 0-15/1 * * *'
  push:
    branches: [main]
    paths:
      - 'update_website.py'
      - 'requirements.txt'
      - '.github/workflows/python_update.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install data dependencies
        run: python -m pip install pandas akshare pytz
      - name: Update bond rankings
        run: python update_website.py
      - name: Save updated rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/bonds/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update convertible bond rankings"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website and updated rankings
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
